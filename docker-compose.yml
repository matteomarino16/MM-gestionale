# PostgreSQL per lo sviluppo locale (alternativa a PostgreSQL installato con Homebrew).
# Avvio: docker compose up -d   — le credenziali sono lette da .env (POSTGRES_*).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Imposta POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gestionale}
      TZ: Europe/Rome
    # Esposto solo su localhost, mai sulla rete.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
